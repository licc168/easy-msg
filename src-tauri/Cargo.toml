[package]
name = "easy-msg"
version = "0.1.0"
description = "Local inbox for Xiaohongshu and Douyin messages"
authors = ["easy-msg"]
edition = "2024"

[lib]
name = "easy_msg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
